# FORGE Framework — HUMAN Team Configuration (Example)
#
# This file describes the HUMAN team collaborating on a FORGE project:
# who they are, what they focus on, how they handle notifications and
# integrations.
#
# It is DISTINCT from any agent team configuration, which describes the
# AGENT team (orchestrator + hat sub-agents + policies). Both can coexist —
# the agent team config tells the orchestrator how to run cycles; this file
# tells humans how they work together around those cycles.

project: team-project
description: Multi-developer collaborative project

# Team collaboration mode (for humans, not agents)
mode: collaborative

# AI preferences
ai:
  primary: claude
  model: sonnet

# Agent configuration
agents:
  dynamic: true
  auto_detect: true
  
  # Team-specific agents
  specializations:
    - product-owner
    - qa-engineer
    - tech-lead
    - scrum-master

# Team configuration
team:
  # Team members and their typical focus areas
  members:
    - name: Alice Anderson
      role: product-owner
      email: alice@example.com
      focus: [focus, evaluate]
      agents: [product-owner, architect]
    
    - name: Bob Builder
      role: senior-developer
      email: bob@example.com
      focus: [orchestrate, refine]
      agents: [developer, api-developer]
    
    - name: Charlie Chen
      role: qa-engineer
      email: charlie@example.com
      focus: [refine, generate]
      agents: [qa-engineer, security-tester]
    
    - name: Diana Davis
      role: devops-engineer
      email: diana@example.com
      focus: [generate]
      agents: [devops, cloud-engineer]
  
  # Workflow configuration
  workflow:
    parallel_features: true      # Allow multiple active cycles
    phase_handoffs: true         # Enable phase ownership tracking
    require_approval: false      # Default: machine-led. Humans review at Evaluate
                                 # disposition and on escalation triggers, not at
                                 # every phase boundary. Set to `true` for human-led
                                 # projects (e.g., learning the methodology, high-risk
                                 # domains) per FORGE's collaboration spectrum.
    merge_strategy: manual       # How to handle conflicts
    
  # Communication
  notifications:
    phase_complete: true        # Notify on phase completion
    blockers: true             # Notify on blockers
    mentions: true             # Notify on @mentions
    
  # Integration
  integrations:
    git: true                  # Git branch per feature
    slack: false               # Slack notifications (future)
    jira: false               # Jira integration (future)